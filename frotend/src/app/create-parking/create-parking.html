<div class="col-md-6 offset-md-3">
<h3> Register Parking Lot </h3>
<form (ngSubmit) = "onSubmit()">

    <div class="form-group">
        <label>Lot</label>
        <input type="number" class="form-control" id="lot"
            [(ngModel)] = "parking.lot" name="lot">
    </div>

    <div class="form-group">
        <label>Location</label>
        <input type="text" class="form-control" id="location"
            [(ngModel)] = "parking.location" name="location">
    </div>

    <div class="form-group">
        <label>Capacity</label>
        <input type="number" class="form-control" id="capacity"
            [(ngModel)] = "parking.capacity" name="capacity">
    </div>

    <div class="form-group">
        <label>Cost</label>
        <input type="number" class="form-control" id="cost"
            [(ngModel)] = "parking.cost" name="cost">
    </div>
  

    <button class = "btn btn-success" type="submit">Submit</button>

</form>
</div>
